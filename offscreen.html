<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AirSign tracker</title>
  <style>
    html, body { margin: 0; padding: 0; background: #06080f; overflow: hidden; }
    canvas { display: block; width: 320px; height: 180px; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <video id="camera" muted playsinline aria-hidden="true"></video>
  <canvas id="preview" width="320" height="180" aria-hidden="true"></canvas>
  <script src="offscreen.js"></script>
</body>
</html>
