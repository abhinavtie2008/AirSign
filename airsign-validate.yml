name: Validate AirSign

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest JSON and required files
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest_path = Path("manifest.json")
          if not manifest_path.is_file():
              sys.exit("ERROR: manifest.json was not found in the repository root.")

          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              sys.exit(f"ERROR: manifest.json is invalid JSON: {exc}")

          if manifest.get("manifest_version") != 3:
              sys.exit("ERROR: expected manifest_version to be 3.")

          required_files = [
              "manifest.json",
              "sidepanel.html",
              "sidepanel.js",
              "content.js",
              "service-worker.js",
          ]
          missing = [name for name in required_files if not Path(name).is_file()]
          if missing:
              sys.exit("ERROR: required file(s) missing from repository root: " + ", ".join(missing))

          print("Manifest JSON is valid, Manifest V3 is enabled, and required files exist.")
          PY

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in sidepanel.js content.js service-worker.js; do
            echo "Checking $file"
            node --check "$file"
          done

