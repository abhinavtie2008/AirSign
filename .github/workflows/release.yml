name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify the tag matches manifest.json
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest v${VERSION}." >&2
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      - name: Check extension syntax
        run: npm run check

      - name: Check docs and runtime assets are in sync
        run: npm run check:docs

      - name: Build the release ZIP
        run: npm run package

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")
          TAG="v${VERSION}"
          ZIP="dist/AirSign-v${VERSION}.zip"
          STORE="dist/AirSign-v${VERSION}-store.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "${ZIP}.sha256" "$STORE" "${STORE}.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" "$STORE" "${STORE}.sha256" \
              --title "AirSign v${VERSION}" \
              --generate-notes
          fi
