name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run unit tests
        run: npm test

      - name: Check extension syntax
        run: npm run check

      - name: Check docs and runtime assets are in sync
        run: npm run check:docs

      - name: Build the release ZIP
        run: npm run package

      - name: Upload the unpacked build
        uses: actions/upload-artifact@v7
        with:
          name: AirSign-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
