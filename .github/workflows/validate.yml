name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Check extension syntax
        run: npm run check

      - name: Check docs and runtime assets are in sync
        run: npm run check:docs

      - name: Build the release ZIP
        run: npm run package

      - name: Upload the unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: AirSign-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
